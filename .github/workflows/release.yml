name: Release APK

# Publishes the debug APK as a GitHub Release asset (keeps the binary out of
# git history while still making it downloadable from the repo's Releases page).
# Trigger by pushing a tag like v1.0-debug, or run manually via the Actions tab.
on:
  push:
    tags: ['v*']
    branches: [claude/fix-L0gbb]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        default: "v1.0-debug"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0-debug' }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mycilliyums-${TAG}-debug.apk"
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0-debug' }}
          name: Mycilliyums ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0-debug' }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.apk
